[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-agent"
version = "0.1.0"
description = "Autonomous multi-provider inbox agent: triage, draft in your voice, send with escalation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "omkargs", email = "omkargskrishnan@gmail.com" }]
keywords = ["email", "gmail", "outlook", "mcp", "agent", "anthropic", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.0.0,<3.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0,<2.0.0",
    "msal>=1.28.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mail-agent = "mailagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
